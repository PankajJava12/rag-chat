global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: advisor-api
    static_configs:
      - targets: [api:9464]
  - job_name: advisor-worker
    static_configs:
      - targets: [worker:9465]
