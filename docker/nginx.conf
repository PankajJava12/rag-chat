server {
  listen 8080;
  server_name _;
  client_max_body_size 25m;
  proxy_read_timeout 300s;
  # Refresh Docker service DNS when the API container is replaced.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api_backend http://${API_UPSTREAM};
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;
  location /api/ { proxy_pass $api_backend; }
  location /health/ { proxy_pass $api_backend; }
  location / { try_files $uri $uri/ /index.html; }
}
