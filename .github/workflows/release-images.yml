# Build artifacts only. There is deliberately no terraform apply or ECS update step.
name: Build deployable images
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --target runtime -t advisor-api:${GITHUB_SHA} . -f docker/Dockerfile
      - run: docker build --target web -t advisor-web:${GITHUB_SHA} . -f docker/Dockerfile
      - run: docker save advisor-api:${GITHUB_SHA} advisor-web:${GITHUB_SHA} | gzip > advisor-images.tar.gz
      - uses: actions/upload-artifact@v4
        with: {name: deployable-images, path: advisor-images.tar.gz, retention-days: 7}
