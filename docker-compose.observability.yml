# Monitoring only: host API/worker/web remain native processes.
name: advisor-observability
services:
  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v3.5.0
    command:
      [
        --config.file=/etc/prometheus/prometheus.yml,
        --storage.tsdb.retention.time=7d,
      ]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      [
        "./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro",
        "./docker/observability/alerts.yml:/etc/prometheus/alerts.yml:ro",
        "prometheus-data:/prometheus",
      ]
    mem_limit: 256m
  tempo:
    restart: unless-stopped
    environment: { GOMEMLIMIT: 256MiB, GOGC: 50 }
    image: grafana/tempo:2.8.2
    command: [-config.file=/etc/tempo.yml]
    ports: ["127.0.0.1:4318:4318", "127.0.0.1:3200:3200"]
    volumes:
      [
        "./docker/observability/tempo.yml:/etc/tempo.yml:ro",
        "tempo-data:/var/tempo",
      ]
    mem_limit: 512m
  grafana:
    restart: unless-stopped
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:3002:3000"]
    volumes:
      [
        "./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro",
        "./docker/observability/grafana/dashboards:/etc/grafana/dashboards:ro",
        "grafana-data:/var/lib/grafana",
      ]
    mem_limit: 256m
  alertmanager:
    restart: unless-stopped
    image: prom/alertmanager:v0.28.1
    command: [--config.file=/etc/alertmanager/alertmanager.yml]
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      [
        "./docker/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro",
      ]
    mem_limit: 64m
volumes:
  prometheus-data:
  tempo-data:
  grafana-data:
